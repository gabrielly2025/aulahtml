<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula HTML</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h2>Formulário</h2>
    <form method="post">

        <fieldset style="width: 300px;" class="formulario">
            <legend>Informações Pessoais</legend>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br>
        <label for="idade">Idade:</label><br>
        <input type="number" min="18" max="20" id="idade" name="idade" required><br>
        <label for="idade">Idade (slider):</label><br>
        <input type="range" id="idade" name="idade" min="0" max="100" required><br> 
        <input type="color" id="cor" name="cor" required><br>
        <label for="data">Data:</label><br>        
        <input type="date" id="data" name="data" required><br>
        <label for="part">CPF:</label><br>
        <input type="text" id="part" name="part" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite o CPF no formato 000.000.000-00">
        <br>
        <label for="idiomas">Idiomas:</label><br>
        <input type="checkbox" id="idiomas" name="idiomas" value="ingles"> Inglês
        <input type="checkbox" id="idiomas" name="idiomas" value="espanhol"> Espanhol
        <input type="checkbox" id="idiomas" name="idiomas" value="frances"> Francês
        <input type="checkbox" id="idiomas" name="idiomas" value="alemão"> Alemão
        <input type="checkbox" id="idiomas" name="idiomas" value="italiano"> Italiano

        <br>
        <label for="sexo">Sexo:</label><br>
        <input type="radio" id="masculino" name="sexo" value="masculino" required> Masculino
        <input type="radio" id="feminino" name="sexo" value="feminino" required> Feminino
        <input type="radio" id="outro" name="sexo" value="outro" required> Outro

        <br>
        <label for="cidades">Cidade:</label>
        <select id="cidades" name="cidades" required>
            <option value="">Selecione uma cidade</option>
            <option value="sao_paulo">São Paulo</option>
            <option value="rio_de_janeiro">Rio de Janeiro</option>
            <option value="belo_horizonte">Belo Horizonte</option>
            <option value="curitiba">Curitiba</option>
            <option value="porto_alegre">Porto Alegre</option>
        </select>

        <br>

        <label for="observacoes">Observações:</label><br>
        <textarea id="observacoes" name="observacoes" rows="4" cols="50"></textarea>

        <br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
        </fieldset>
    </form>

</body>
</html>
